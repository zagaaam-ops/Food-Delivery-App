name: Build Flutter APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.0'

      - name: Install dependencies
        run: flutter pub get
        working-directory: pakistan-delivery-app/mobile

      - name: Build APK
        run: flutter build apk --release
        working-directory: pakistan-delivery-app/mobile

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: pakistan-delivery-apk
          path: pakistan-delivery-app/mobile/build/app/outputs/flutter-apk/app-release.apk
